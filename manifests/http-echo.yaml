apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: myapp
  labels:
    app: http-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-echo
  template:
    metadata:
      labels:
        app: http-echo
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:5678"
            - "-text=<h1 style='font-size:60px;color:red;'>Hello from K8s</h1>"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: http-echo-svc
  namespace: myapp
spec:
  selector:
    app: http-echo
  ports:
    - port: 80
      targetPort: 5678
      protocol: TCP
      name: http
